<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>結果 | 4択問題集</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main class="container result">
    <p class="eyebrow">RESULT</p>
    <h1>お疲れさまでした</h1>
    <p class="score"><span th:text="${score}">0</span> / <span th:text="${totalQuestions}">0</span> 問正解</p>
    <p class="percentage" th:text="${percentage + '%'}">0%</p>
    <form th:action="@{/quiz/restart}" method="post">
        <button class="button primary" type="submit">もう一度挑戦する</button>
    </form>
</main>
</body>
</html>
