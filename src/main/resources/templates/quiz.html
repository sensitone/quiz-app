<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>4択問題集</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main class="container">
    <p class="eyebrow">QUESTION <span th:text="${questionNumber}"></span> / <span th:text="${totalQuestions}"></span></p>
    <h1 th:text="${question.questionText}">問題文</h1>

    <form class="choices" th:if="${!finalQuestion}" th:action="@{/quiz/answer}" method="post">
        <input type="hidden" name="questionId" th:value="${question.id}">
        <label class="choice" th:each="choice : ${question.choices}">
            <input type="radio" name="choiceId" th:value="${choice.id}" required>
            <span th:text="${choice.choiceText}">選択肢</span>
        </label>
        <button class="button primary" type="submit">回答する</button>
    </form>

    <section class="feedback" th:if="${lastResult != null}">
        <h2 th:text="${lastResult ? '正解です！' : '不正解です'}">結果</h2>
        <p th:text="${lastExplanation != null ? lastExplanation : session.lastExplanation}">解説</p>
        <form th:if="${finalQuestion}" th:action="@{/quiz/result}" method="get">
            <button class="button primary" type="submit">結果を見る</button>
        </form>
    </section>
</main>
</body>
</html>
