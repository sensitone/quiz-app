services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-question_app}
      POSTGRES_USER: ${POSTGRES_USER:-question_app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-question_app_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-question_app_user} -d ${POSTGRES_DB:-question_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
